version: '3.8'

services:
  galera-node1:
    image: bitnamilegacy/mariadb-galera:10.11
    environment:
      - MARIADB_GALERA_CLUSTER_NAME=erp_db_cluster
      # FIXED: Internal nodes handshake on their bare global Swarm aliases
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm://galera-node1,galera-node2,galera-node3
      - MARIADB_GALERA_CLUSTER_BOOTSTRAP=yes
      - MARIADB_ROOT_PASSWORD=Aa123123
      - MARIADB_USER=frappe_user
      - MARIADB_PASSWORD=Aa123123
      - MARIADB_DATABASE=frappe_production
      - MARIADB_GALERA_MARIABACKUP_USER=mariabackup
      - MARIADB_GALERA_MARIABACKUP_PASSWORD=Aa123123
    volumes:
      - galera-node1-data:/bitnami/mariadb
    networks:
      dokploy-network:
        # FIXED: Forces Swarm DNS to map "galera-node1" inside ProxySQL's network
        aliases:
          - galera-node1

  galera-node2:
    image: bitnamilegacy/mariadb-galera:10.11
    environment:
      - MARIADB_GALERA_CLUSTER_NAME=erp_db_cluster
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm://galera-node1,galera-node2,galera-node3
      - MARIADB_ROOT_PASSWORD=Aa123123
      - MARIADB_USER=frappe_user
      - MARIADB_PASSWORD=Aa123123
      - MARIADB_DATABASE=frappe_production
      - MARIADB_GALERA_MARIABACKUP_USER=mariabackup
      - MARIADB_GALERA_MARIABACKUP_PASSWORD=Aa123123
    volumes:
      - galera-node2-data:/bitnami/mariadb
    networks:
      dokploy-network:
        aliases:
          - galera-node2

  galera-node3:
    image: bitnamilegacy/mariadb-galera:10.11
    environment:
      - MARIADB_GALERA_CLUSTER_NAME=erp_db_cluster
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm://galera-node1,galera-node2,galera-node3
      - MARIADB_ROOT_PASSWORD=Aa123123
      - MARIADB_USER=frappe_user
      - MARIADB_PASSWORD=Aa123123
      - MARIADB_DATABASE=frappe_production
      - MARIADB_GALERA_MARIABACKUP_USER=mariabackup
      - MARIADB_GALERA_MARIABACKUP_PASSWORD=Aa123123
    volumes:
      - galera-node3-data:/bitnami/mariadb
    networks:
      dokploy-network:
        aliases:
          - galera-node3

networks:
  dokploy-network:
    external: true

volumes:
  galera-node1-data:
  galera-node2-data:
  galera-node3-data:
