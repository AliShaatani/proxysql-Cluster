version: '3.8'

services:
  galera-node1:
    image: bitnamilegacy/mariadb-galera:10.11
    environment:
      - MARIADB_GALERA_CLUSTER_NAME=erp_db_cluster
      # FIXED: Swarm global routing requires explicit service-name addressing instead of network-scoped stack aliases
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm://erpdbcluster-cluster_galera-node1,erpdbcluster-cluster_galera-node2,erpdbcluster-cluster_galera-node3
      - MARIADB_GALERA_CLUSTER_BOOTSTRAP=yes
      - MARIADB_ROOT_PASSWORD=Aa123123
      - MARIADB_USER=frappe_user
      - MARIADB_PASSWORD=Aa123123
      - MARIADB_DATABASE=frappe_production
      # FIXED: Added required replication credentials to satisfy newer Bitnami entrypoint validation checks
      - MARIADB_GALERA_MARIABACKUP_USER=mariabackup
      - MARIADB_GALERA_MARIABACKUP_PASSWORD=Aa123123
    volumes:
      - galera-node1-data:/bitnami/mariadb
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  galera-node2:
    image: bitnamilegacy/mariadb-galera:10.11
    environment:
      - MARIADB_GALERA_CLUSTER_NAME=erp_db_cluster
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm://erpdbcluster-cluster_galera-node1,erpdbcluster-cluster_galera-node2,erpdbcluster-cluster_galera-node3
      - MARIADB_ROOT_PASSWORD=Aa123123
      - MARIADB_USER=frappe_user
      - MARIADB_PASSWORD=Aa123123
      - MARIADB_DATABASE=frappe_production
      - MARIADB_GALERA_MARIABACKUP_USER=mariabackup
      - MARIADB_GALERA_MARIABACKUP_PASSWORD=Aa123123
    volumes:
      - galera-node2-data:/bitnami/mariadb
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  galera-node3:
    image: bitnamilegacy/mariadb-galera:10.11
    environment:
      - MARIADB_GALERA_CLUSTER_NAME=erp_db_cluster
      - MARIADB_GALERA_CLUSTER_ADDRESS=gcomm://erpdbcluster-cluster_galera-node1,erpdbcluster-cluster_galera-node2,erpdbcluster-cluster_galera-node3
      - MARIADB_ROOT_PASSWORD=Aa123123
      - MARIADB_USER=frappe_user
      - MARIADB_PASSWORD=Aa123123
      - MARIADB_DATABASE=frappe_production
      - MARIADB_GALERA_MARIABACKUP_USER=mariabackup
      - MARIADB_GALERA_MARIABACKUP_PASSWORD=Aa123123
    volumes:
      - galera-node3-data:/bitnami/mariadb
    networks:
      - erpnext-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  erpnext-network:
